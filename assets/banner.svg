<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Free AI Coding Agents</title>
  <desc id="desc">Animated banner for 100+ verified free AI coding agents and platforms</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <radialGradient id="glowL" cx="18%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowR" cx="84%" cy="58%" r="44%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowC" cx="50%" cy="18%" r="36%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2f6ff"/>
      <stop offset="38%" stop-color="#67e8f9"/>
      <stop offset="62%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f8fafc"/>
      <animate attributeName="x1" values="-20%;0%;-20%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;120%;80%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;130%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="chipStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.9" fill="#67e8f9" fill-opacity="0.18"/>
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1400" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="360" fill="url(#bg)"/>
    <rect width="1400" height="360" fill="url(#glowL)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1400" height="360" fill="url(#glowR)">
      <animate attributeName="opacity" values="1;0.7;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect width="1400" height="360" fill="url(#glowC)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect width="1400" height="360" fill="url(#grid)"/>
    <rect width="1400" height="360" fill="url(#dots)" opacity="0.55"/>

    <!-- drifting particles -->
    <g fill="#67e8f9" filter="url(#tinyGlow)">
      <circle cx="90" cy="70" r="2.2">
        <animate attributeName="cy" values="70;48;70" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.95;0.25" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="290" r="1.8" fill="#a78bfa">
        <animate attributeName="cy" values="290;250;290" dur="6.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1180" cy="86" r="2.4">
        <animate attributeName="cx" values="1180;1218;1180" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1290" cy="250" r="1.7" fill="#34d399">
        <animate attributeName="cy" values="250;210;250" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="42" r="1.5">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="318" r="2" fill="#c4b5fd">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="40" r="1.6" fill="#34d399">
        <animate attributeName="cx" values="640;700;640" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- neural graph -->
    <g fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M110 210 C170 150, 230 150, 290 196" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M290 196 C340 230, 390 120, 460 168" stroke="#818cf8" stroke-width="1.3" stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;-42" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M110 210 C160 260, 250 280, 320 250" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4 10">
        <animate attributeName="stroke-dashoffset" values="0;-42" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M940 170 C1020 120, 1100 140, 1188 188" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M980 250 C1060 280, 1140 240, 1224 236" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;-42" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M1188 188 C1220 210, 1240 220, 1224 236" stroke="#34d399" stroke-width="1.1" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <g filter="url(#tinyGlow)">
      <circle cx="110" cy="210" r="5.5" fill="#22d3ee">
        <animate attributeName="r" values="5.5;7.2;5.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="290" cy="196" r="4.4" fill="#67e8f9">
        <animate attributeName="r" values="4.4;6;4.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="250" r="3.6" fill="#34d399">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="460" cy="168" r="3.2" fill="#c4b5fd"/>
      <circle cx="1188" cy="188" r="5.4" fill="#a78bfa">
        <animate attributeName="r" values="5.4;7;5.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1224" cy="236" r="4" fill="#22d3ee">
        <animate attributeName="r" values="4;5.6;4" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="250" r="3.4" fill="#34d399"/>
    </g>

    <!-- scanline -->
    <rect x="0" y="-24" width="1400" height="28" fill="url(#scanGrad)" opacity="0.55">
      <animate attributeName="y" values="-28;360;-28" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- wordmark -->
    <g text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
      <text x="700" y="86" fill="#67e8f9" font-size="15" letter-spacing="6.4" font-weight="600">THE ULTIMATE GUIDE</text>
      <text x="700" y="168" fill="url(#wordmark)" font-size="54" font-weight="800" letter-spacing="1.2" filter="url(#softGlow)">FREE AI CODING AGENTS</text>
      <text x="700" y="214" fill="#cbd5e1" font-size="20" letter-spacing="1.4">100+ Best Free AI Coding Agents &amp; Platforms</text>
    </g>

    <!-- blinking cursor after title -->
    <rect x="1074" y="132" width="10" height="34" rx="2" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <!-- status chips -->
    <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1" text-anchor="middle">
      <g transform="translate(430,268)">
        <rect x="-108" y="-18" width="216" height="36" rx="18" fill="#0b1324" stroke="url(#chipStroke)" stroke-width="1.4"/>
        <circle cx="-82" cy="0" r="4" fill="#34d399">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="8" y="5" fill="#e2e8f0">VERIFIED FREE TIERS</text>
      </g>
      <g transform="translate(700,268)">
        <rect x="-92" y="-18" width="184" height="36" rx="18" fill="#0b1324" stroke="url(#chipStroke)" stroke-width="1.4"/>
        <text x="0" y="5" fill="#e2e8f0">GOD TIER PICKS</text>
      </g>
      <g transform="translate(970,268)">
        <rect x="-96" y="-18" width="192" height="36" rx="18" fill="#0b1324" stroke="url(#chipStroke)" stroke-width="1.4"/>
        <text x="0" y="5" fill="#e2e8f0">$0 PRODUCTION STACK</text>
      </g>
    </g>

    <!-- energy bar -->
    <rect x="90" y="338" width="1220" height="3" rx="2" fill="url(#bar)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="338" width="220" height="3" rx="2" fill="#e0f2fe" opacity="0.85">
      <animate attributeName="x" values="90;1090;90" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <rect x="1" y="1" width="1398" height="358" rx="17" fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="1.2"/>
  </g>
</svg>
